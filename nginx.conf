# nginx 配置模板。两个占位符会在容器启动时经 envsubst 替换：
#   ${NGINX_PORT}  对外监听端口（默认 7001）
#   ${BACKEND_PORT} 后端内部端口（默认 9000）
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    upstream backend {
        server 127.0.0.1:${BACKEND_PORT};
    }

    server {
        listen ${NGINX_PORT};
        server_name _;

        # Built frontend (SPA)
        root /app/dist;
        index index.html;

        # WebSocket endpoint used by code generation
        location /generate-code {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # REST API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Locally stored assets served by the backend
        location /local-assets/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Static files + SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}